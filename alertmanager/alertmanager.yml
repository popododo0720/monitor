global:
  resolve_timeout: 5m
  # Email receiver를 쓸 때 아래 값을 실제 SMTP 정보로 교체.
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'monitor@example.com'
  smtp_auth_username: 'monitor@example.com'
  smtp_auth_password: 'CHANGE_ME'
  smtp_require_tls: true

route:
  receiver: blackhole
  group_by: ['alertname', 'job', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: blackhole

  - name: discord
    discord_configs:
      - webhook_url: 'https://discordapp.com/api/webhooks/1506540307582292049/ws6nHjvGMr-1ZaM1rRiGcyNRG4vxizXxjuEjXN1mJupo5GX2SZehVZ4NkE5oTKM2jmEG'
        send_resolved: true

  - name: slack
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/CHANGE/ME'
        channel: '#monitoring'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts -}}
          *{{ .Labels.instance }}* {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  - name: email
    email_configs:
      - to: 'admin@example.com'
        send_resolved: true
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
